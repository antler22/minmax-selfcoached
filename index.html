/* ============================================================================
   MIN-MAX SELF-COACHED  —  Nippard Min-Max Phase 2 skeleton
                            + RP autoregulation  + your barbell anchors
   Everything is data-driven. To tweak a workout, edit PROGRAM below.
   ========================================================================== */

/* ---------- 1. PROGRAM DEFINITION -----------------------------------------
   Nippard's Min-Max Phase 2 never changes set counts across the 12 weeks.
   It progresses ONLY by RIR + (in Block 2) intensity techniques:
     wk 1      = intro      -> "easy" RIR
     wk 2-6    = Block 1    -> "hard" RIR
     wk 7      = deload     -> "easy" RIR (+ we drop Tier-B work)
     wk 8-12   = Block 2    -> "hard" RIR + intensity technique
   Each exercise below carries the exact RIR schedule of the Nippard exercise
   it replaces, so the progression logic is preserved through the swaps.

   tier: "A" = never cut.  "B" = dropped automatically when time is short,
         on deload week, or when readiness is YELLOW/RED.
   inc:  load increment in lb when you earn a jump.
   pair: this is the high-rep back-off set of the exercise above it.
--------------------------------------------------------------------------- */

         "Repeat (20 sec rest + mini-set) for 3-5 clusters, or stop when you can't get 3 clean reps."],
  drop2:["Two Drop Sets","At RIR 0, immediately strip ~25% of the load and go to failure again. "+
         "Strip ~25% one more time and go to failure a third time. No rest between drops."],

// rir: {e:[...easy week 1/7], h:[...hard weeks 2-6 & 8-12]} — one entry per working set

     rir:{e:[1],h:[0]}, src:"Glute Kickback",

     note:"Light. This is a high-rep glute/lower-back/hamstring finisher — 30 reps."}
  ]},

  push: { name:"Push", muscles:["delts","chest","triceps","quads"], ex:[
    {id:"ohp",     n:"Seated DB Shoulder Press", tier:"A", sets:2, rep:[4,6], rest:180, inc:5, warm:"2-3",
     rir:{e:[1,2],h:[0,1]}, tech:"drop2", src:"Machine Shoulder Press",
     subs:["Seated Smith Machine Shoulder Press","Standing Barbell OHP","Machine Shoulder Press"],
     note:"Break at least 90 degrees at the elbow. Smooth and controlled — feel the delts."},

    {id:"dbbench", n:"DB Bench Press", tier:"A", sets:1, rep:[10,10], rest:180, inc:5, warm:"2-3",
     rir:{e:[1],h:[0]}, src:"DB Bench Press",
     subs:["Barbell Bench Press","Machine Chest Press"],
     note:"1 second pause at the bottom, tension on the pecs."},
    {id:"dbbench20",n:"DB Bench Press — Back-off", tier:"B", pair:"dbbench", sets:1, rep:[20,20], rest:180, inc:5, warm:"0",
     rir:{e:[1],h:[0]}, src:"DB Bench Press 1x20", subs:["Push-Up (to failure)"], note:""},

    {id:"slext",   n:"Single-Leg Leg Extension", tier:"B", sets:1, rep:[20,20], rest:90, inc:5, warm:"0-1", perLeg:true,
     rir:{e:[1],h:[0]}, src:"Single-Leg Leg Extension",
     subs:["Reverse Nordic","Sissy Squat"],
     note:"20 per leg. Nippard's extra weekly quad hit — cheap volume, keep it if you have time."},

    {id:"lat",     n:"DB Lateral Raise", tier:"A", sets:1, rep:[10,10], rest:90, inc:5, warm:"0-1",
     rir:{e:[0],h:[0]}, src:"Machine Lateral Raise",
     subs:["Cable Lateral Raise","Machine Lateral Raise"],
     note:"Resist the negative on every rep. Do not pause at the bottom."},
    {id:"lat20",   n:"DB Lateral Raise — Back-off", tier:"A", pair:"lat", sets:1, rep:[20,20], rest:90, inc:5, warm:"0",
     rir:{e:[0],h:[0]}, src:"Machine Lateral Raise 1x20",
     subs:["Cable Lateral Raise"],
     note:"Drop to roughly half the weight and chase 20. This pair IS your side-delt volume."},

    {id:"flye_p",  n:"DB Flye", tier:"B", sets:2, rep:[10,12], rest:90, inc:5, warm:"0-1",
     rir:{e:[0,1],h:[0,0]}, tech:"drop2", src:"Cable Flye",
     subs:["Cable Flye","Pec Deck"],
     note:"Focus on a deep stretch in the pecs at the bottom of every rep."},

    {id:"pressdown",n:"Cable Triceps Pressdown", tier:"A", sets:2, rep:[4,6], rest:90, inc:5, warm:"0-1",
     rir:{e:[0,1],h:[0,0]}, tech:"myo", src:"Triceps Pressdown",
     subs:["Overhead Cable Triceps Extension","DB Skull Crusher","Close-Grip Push-Up"],
     note:"Rope or straight bar, whichever is comfortable. Heavy for a pressdown — 4-6 reps."}
  ]},

  pull: { name:"Pull", muscles:["back","hamstrings","rear delts","biceps","abs"], ex:[
    {id:"pullup",  n:"Pull-Up (Wide Grip)", tier:"A", sets:3, rep:[4,6], rest:180, inc:5, warm:"1-2", bw:true,

     subs:["Lat Pulldown (Wide Grip)","Assisted Pull-Up"],

    {id:"rdl",     n:"Barbell Romanian Deadlift", tier:"A", sets:2, rep:[6,8], rest:180, inc:10, warm:"2-3",
     rir:{e:[2,3],h:[1,2]}, src:"Stiff-Leg Deadlift",

     rir:{e:[1],h:[0]}, src:"Close-Grip Lat Pulldown 1x20", subs:["Close-Grip Seated Cable Row"], note:""},

    {id:"revflye10",n:"Reverse DB Flye — Heavy", tier:"B", pair:"revflye", sets:1, rep:[10,10], rest:90, inc:5, warm:"0",

    {id:"hammer",  n:"DB Hammer Curl", tier:"A", sets:2, rep:[6,8], rest:90, inc:5, warm:"0-1",

     subs:["Preacher Hammer Curl","DB Preacher Curl","Cable Hammer Curl"],

    {id:"crunch",  n:"Cable Crunch", tier:"B", sets:2, rep:[6,8], rest:90, inc:5, warm:"0-1",
     rir:{e:[0,1],h:[0,0]}, tech:"drop2", src:"Cable Crunch",

const DAY_ORDER = ["upper","lower","push","pull"];
const TOTAL_WEEKS = 12;

const weekKind = w => w===1 ? "intro" : w===7 ? "deload" : w<=6 ? "block1" : "block2";
const isEasyWeek = w => w===1 || w===7;
const blockOf    = w => w<=7 ? 1 : 2;

/* ---------- 2. STATE / PERSISTENCE --------------------------------------- */

const KEY = "minmax_v1";
const DEF = {
  settings:{ unit:"lb", timeCap:45, subs:{}, bwOverride:{} },
  week:1, dayIdx:0, sessions:[], active:null, bw:[]
};
let S = load();

function load(){
  try{ const r = JSON.parse(localStorage.getItem(KEY)); if(r&&r.settings) return {...DEF,...r,settings:{...DEF.settings,...r.settings}}; }
  catch(e){ console.warn("load failed",e); }
  return structuredClone(DEF);
}
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }

// display name honours any substitution you've chosen
const exName = ex => S.settings.subs[ex.id] || ex.n;

/* ---------- 3. COACHING ENGINE ------------------------------------------- */

// RIR prescribed for a given exercise/set/week (inherits the Nippard schedule)
function rirFor(ex, week, setIdx){
  const a = isEasyWeek(week) ? ex.rir.e : ex.rir.h;
  return a[Math.min(setIdx, a.length-1)];
}
// Intensity technique only exists in Block 2 (weeks 8-12), on the last set
function techFor(ex, week){ return (blockOf(week)===2 && week!==7 && ex.tech) ? ex.tech : null; }

function roundLoad(w, inc){
  if(w<=0) return 0;
  return Math.max(inc, Math.round(w/inc)*inc);
}

/* Deload weeks and Red auto-deload days are deliberately submaximal. They must
   never become the baseline for the next load target, or every deload would
   permanently ratchet your working weights down. They stay in the log and in
   your history — they're just skipped when answering "what should I lift?". */
const submaximal = s => s.week===7 || (s.readiness && s.readiness.band==="red");

// every logged set for an exercise, newest session first
function historyFor(exId, opts={}){
  const out=[];
  for(let i=S.sessions.length-1;i>=0;i--){
    const s=S.sessions[i], e=s.entries&&s.entries[exId];
    if(opts.working && submaximal(s)) continue;
    if(e && e.some(x=>x && x.reps>0)) out.push({session:s, sets:e.filter(x=>x&&x.reps>0)});
  }
  return out;
}

/* The core session-to-session prescription.
   Returns {weight, reps, msg, kind} for one set. */
function prescribe(ex, week, setIdx){
  const tRir = rirFor(ex, week, setIdx);
  const hist = historyFor(ex.id, {working:true});   // baseline ignores deload/Red days
  const [lo,hi] = ex.rep;

  if(!hist.length){
    return { weight:null, reps:lo, kind:"find",
      msg:`First time on this lift. Pick a load you could get about ${hi+2} reps with, then stop at RIR ${tRir}. Whatever you log becomes your baseline.` };
  }

  const last = hist[0];
  const prev = last.sets[Math.min(setIdx, last.sets.length-1)];
  const w = prev.weight, r = prev.reps, rir = prev.rir;
  const ago = last.session.week;
  const dl  = isEasyWeek(week);

  // Deload / intro week: back the load off deliberately
  if(dl && week===7){
    return { weight: roundLoad(w*0.9, ex.inc), reps:r, kind:"deload",
      msg:`Deload week. Same reps at about 90% of your week-6 load, stopping at RIR ${tRir}. The point is to shed fatigue — do not push.` };
  }

  // Earned a load jump: hit or beat the top of the range at or under target RIR.
  // Overshooting by 2+ reps means the load was well short — jump harder than one increment.
  if(r >= hi && rir <= tRir){
    const steps = Math.min(3, 1 + Math.floor((r-hi)/2));
    const bump = ex.inc*steps;
    return { weight: roundLoad(w+bump, ex.inc), reps:lo, kind:"up",
      msg: steps>1
        ? `You got ${r} @ RIR ${rir} in week ${ago} — ${r-hi} reps past the top of the range, so that load was too light. Jump ${bump} lb and restart at ${lo} reps.`
        : `You hit ${r} @ RIR ${rir} in week ${ago} — top of the range. Add ${bump} lb and restart at ${lo} reps.` };
  }
  // In range but left reps in the tank: same load, push closer to failure
  if(r >= lo && rir > tRir){
    return { weight:w, reps:r+1, kind:"same",
      msg:`Last time you stopped at RIR ${rir} but the target is RIR ${tRir}. Same weight — go ${rir-tRir} rep${rir-tRir>1?"s":""} deeper. Aim for ${r+1}.` };
  }
  // In range, correct effort: chase one more rep (double progression)
  if(r >= lo){
    return { weight:w, reps:r+1, kind:"same",
      msg:`You got ${r} @ RIR ${rir}. Same weight — beat it. Target ${r+1}, and once you reach ${hi} the weight goes up.` };
  }
  // Under the range but they weren't actually near failure: keep the load, try again
  if(rir >= tRir+1){
    return { weight:w, reps:lo, kind:"same",
      msg:`Only ${r} reps last time, but at RIR ${rir} — that was pacing, not the weight. Keep ${w} and take it to RIR ${tRir}.` };
  }
  /* Genuinely under the range at target effort. One bad session is noise — sleep,
     stress, a rushed warm-up — and dropping 8% off a single miss wipes out weeks of
     progress and makes the load oscillate. Only cut after two in a row at the same weight. */
  const prior = hist[1] && hist[1].sets[Math.min(setIdx, hist[1].sets.length-1)];
  const missedTwice = prior && prior.weight >= w && prior.reps < lo && prior.rir <= tRir;
  if(!missedTwice){
    return { weight:w, reps:lo, kind:"hold",
      msg:`${r} reps @ RIR ${rir} came in under the ${lo}-${hi} range. One miss isn't a trend — same weight again. If you miss it twice in a row I'll drop the load for you.` };
  }
  return { weight: roundLoad(w*0.92, ex.inc), reps:lo, kind:"down",
    msg:`Second session in a row under ${lo} reps at ${w} lb. Dropping about 8% to rebuild — you'll pass the old number inside a couple of sessions.` };
}

/* ---- Readiness / fatigue monitoring (RP-flavoured) ---- */
const RQ = [
  {id:"sore", q:"Soreness in today's muscles", a:[
    ["Never got sore",0],["Healed a while ago",0],["Healed just today",1],["Still sore right now",3]]},
  {id:"sleep",q:"Sleep last night", a:[["Good",0],["OK",1],["Poor",2]]},
  {id:"energy",q:"Energy and motivation", a:[["High",0],["Normal",1],["Flat",2],["Drained",3]]},
  {id:"joint",q:"Joint or connective-tissue pain", a:[["None",0],["Minor niggle",1],["Real pain",3]]}
];

// Did the last two sessions of this day fail to beat their targets?
function perfRegression(dayKey){
  const past = S.sessions.filter(s=>s.day===dayKey && s.done).slice(-2);
  if(past.length<2) return false;
  return past.every(s=>{
    const vals=Object.values(s.entries||{}).flat().filter(x=>x&&x.reps>0);
    return vals.length && vals.filter(x=>x.missed).length > vals.length/2;
  });
}

function readiness(ans, dayKey){
  let score = RQ.reduce((t,q)=> t + (ans[q.id]??0), 0);
  const reg = perfRegression(dayKey);
  if(reg) score += 2;
  let band, label, advice;
  if(score<=2){ band="green"; label="Green — go as programmed";
    advice="You're recovered. Run the session exactly as prescribed and push the target RIR honestly."; }
  else if(score<=5){ band="yellow"; label="Yellow — trim the session";
    advice="Accumulating fatigue. Optional (Tier B) work is dropped and compounds get +1 RIR. Keep the hard sets, lose the junk volume."; }
  else { band="red"; label="Red — auto-deload today";
    advice="You are under-recovered. Today becomes one set per main lift at ~85% load and +3 RIR. This is a session you bank, not one you win."; }
  if((ans.joint??0)>=3) advice += " Flag: you reported real joint pain — substitute any movement that reproduces it before you start.";
  if(reg) advice += " Flag: you missed your targets in your last two "+PROGRAM[dayKey].name+" sessions, which counts against readiness.";
  return {score, band, label, advice, reg};
}

// Should he take a deload week early?
function deloadAdvice(){
  const done = S.sessions.filter(s=>s.done);
  const recent = done.slice(-3);
  const reds = recent.filter(s=>s.readiness&&s.readiness.band==="red").length;
  if(reds>=2) return "Two of your last three sessions came in Red. RP's rule of thumb is that repeated under-recovery means you're over your MRV — take the deload week now rather than grinding to week 7.";
  const yellows = done.slice(-4).filter(s=>s.readiness&&s.readiness.band!=="green").length;
  if(yellows>=4) return "Four sessions in a row below Green. Watch it — if this continues another week, pull the deload forward.";
  return null;
}

/* Build today's exercise list, applying tier cuts from readiness + time cap. */
function buildSession(dayKey, week, band){
  const day = PROGRAM[dayKey];
  const cut = band==="red" ? "red" : (band==="yellow" || week===7) ? "trim" : "full";
  let list = day.ex.filter(ex=> cut==="full" ? true : ex.tier==="A");
  return list.map(ex=>{
    let sets = ex.sets, rirAdj = 0;
    if(cut==="red"){ sets = 1; rirAdj = 3; }
    else if(cut==="trim" && ex.tier==="A" && ex.sets>2 && week!==7){ sets = ex.sets-1; }
    else if(cut==="trim"){ rirAdj = ex.rest>=180 ? 1 : 0; }
    return {ex, sets, rirAdj, loadMul: cut==="red" ? 0.85 : 1};
  });
}

// rough duration in minutes
function estimate(plan){
  let s = 300; // warm-up
  plan.forEach(p=> s += p.sets * ((p.ex.rest||90) + 45));
  return Math.round(s/60);
}

      <h1 style="margin:8px 0 2px">${esc(exName(ex))}</h1>
      ${ssPartner?`<div class="xs" style="color:var(--blue)">Superset ${esc(ex.ss)} with ${esc(exName(ssPartner.ex))} — alternate, minimal rest between</div>`:""}

      <div class="row" style="margin:16px 0 4px;align-items:flex-end;gap:18px">
        <div><div class="xs dim">Target load</div><div class="big mono">${pre0.weight==null?"—":Math.round(pre0.weight*(cur.loadMul||1))}<span style="font-size:16px" class="dim"> lb</span></div></div>
        <div><div class="xs dim">Sets × reps</div><div style="font-size:20px;font-weight:700">${target}</div></div>

      ${ex.warm&&ex.warm!=="0"?`<div class="sm dim">Warm-up: ${esc(ex.warm)} light set${ex.warm==="1"?"":"s"} first — not to failure, just to groove the pattern.</div>`:""}

/* ---------- 5. EVENT BINDING --------------------------------------------- */
function bind(){
  // readiness chips
  document.querySelectorAll(".rq").forEach(b=> b.onclick = ()=>{
    document.querySelectorAll(`.rq[data-q="${b.dataset.q}"]`).forEach(x=>x.className="chip rq");
    ui.ans = ui.ans||{}; ui.ansI = ui.ansI||{};
    ui.ans[b.dataset.q] = +b.dataset.v; ui.ansI[b.dataset.q] = b.dataset.i;
    const band = +b.dataset.v>=3?"r":+b.dataset.v>=1?"w":"g";
    b.className = "chip rq on "+band;
    if(Object.keys(ui.ans).length===RQ.length) showReadiness();
  });
  // a re-render rebuilds the chips, so repaint any answers already given
  if(ui.ansI) Object.entries(ui.ansI).forEach(([q,i])=>{
    const b = document.querySelector(`.rq[data-q="${q}"][data-i="${i}"]`);
    if(b) b.className = "chip rq on " + (ui.ans[q]>=3?"r":ui.ans[q]>=1?"w":"g");
  });
  if(ui.rd && $("#rdout")) showReadiness();
  const ds = $("#daysel"); if(ds) ds.onchange = ()=>{ S.dayIdx = +ds.value; save(); render(); };
  const cap = $("#cap"); if(cap) cap.onchange = ()=>{ S.settings.timeCap = +cap.value||45; save(); };
  const wk  = $("#wk");  if(wk)  wk.onchange  = ()=>{ S.week = Math.max(1,Math.min(12,+wk.value||1)); save(); };
  const imp = $("#imp"); if(imp) imp.onchange = e=>{
    const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ S={...DEF,...JSON.parse(r.result)}; save(); render(); alert("Backup restored."); }
                   catch(err){ alert("That file couldn't be read as a backup."); } };
    r.readAsText(f);
  };
  // set logging
  document.querySelectorAll(".logset").forEach(b=> b.onclick = ()=> logSet(+b.dataset.set));
  document.querySelectorAll(".sub").forEach(b=> b.onclick = ()=>{
    if(b.dataset.name) S.settings.subs[b.dataset.ex] = b.dataset.name;
    else delete S.settings.subs[b.dataset.ex];
    save(); render();
  });
  const sb = $("#startbtn"); if(sb && ui.rd) sb.onclick = start;
  const short = $("#shortbtn");
  if(short) short.onclick = ()=>{ ui.short = !ui.short; render(); if(ui.rd) showReadiness(); };
}

/* Readiness decides effort; the time cap decides breadth. Either one can trim
   the session, but "short on time" must never make it *harder* than readiness allows. */
function effBand(band){ return (ui.short && band==="green") ? "yellow" : band; }

function showReadiness(){
  const dayKey = DAY_ORDER[S.dayIdx];
  const rd = readiness(ui.ans, dayKey);
  ui.rd = rd;
  const plan = buildSession(dayKey, S.week, effBand(rd.band));
  const b = rd.band==="green"?"g":rd.band==="yellow"?"w":"r";
  $("#rdout").innerHTML = `<div class="card" style="margin-top:14px;background:var(--card2)">
    <span class="badge b-${b}">${esc(rd.label)}</span>
    <div class="sm" style="margin-top:9px">${esc(rd.advice)}</div>
    <div class="hr"></div>
    <div class="row sb sm"><span class="dim">Today's session</span>
      <b>${plan.length} exercises · ~${estimate(plan)} min</b></div>
    ${ui.short&&rd.band==="green"?`<div class="xs dim" style="margin-top:6px">Trimmed to Tier A for time — your recovery was fine.</div>`:""}
  </div>`;
  const sb = $("#startbtn");
  sb.disabled = false; sb.textContent = "Start "+PROGRAM[dayKey].name;
  sb.onclick = start;
}

function start(){
  const dayKey = DAY_ORDER[S.dayIdx];
  const plan = buildSession(dayKey, S.week, effBand(ui.rd.band));
  S.active = { day:dayKey, week:S.week, date:Date.now(), readiness:ui.rd, short:!!ui.short, idx:0, entries:{},
               plan: plan.map(p=>({exId:p.ex.id, sets:p.sets, rirAdj:p.rirAdj, loadMul:p.loadMul})) };
  save(); ui.ans=null; ui.ansI=null; ui.rd=null; ui.short=false; go("session");
}

function logSet(k){
  const a=S.active, ex=findEx(a.day, a.plan[Math.min(a.idx,a.plan.length-1)].exId);
  const g=f=>document.querySelector(`[data-set="${k}"][data-f="${f}"]`);
  const w=parseFloat(g("weight").value), r=parseInt(g("reps").value), rir=parseInt(g("rir").value);
  if(isNaN(r)||r<=0){ alert("Enter the reps you actually got."); return; }
  const pre = prescribe(ex, a.week, k);
  a.entries[ex.id] = a.entries[ex.id]||[];
  a.entries[ex.id][k] = { weight:isNaN(w)?(pre.weight||0):w, reps:r, rir:isNaN(rir)?0:rir,
                          missed: r < ex.rep[0] };
  save();
  const cur = a.plan[Math.min(a.idx,a.plan.length-1)];
  if(k < cur.sets-1 && ex.rest) restTimer(ex.rest);
  render();
}

function jump(d){ S.active.idx = Math.max(0, Math.min(S.active.plan.length-1, S.active.idx+d)); save(); render(); }

function finish(){
  const a=S.active;
  const note = prompt("Any note on this session? (optional)")||"";
  a.done=true; a.note=note; a.mins=Math.round((Date.now()-a.date)/60000);
  S.sessions.push(a); S.active=null;
  // advance the day pointer; roll the week after Pull
  S.dayIdx = (S.dayIdx+1) % DAY_ORDER.length;
  if(S.dayIdx===0 && S.week<TOTAL_WEEKS) S.week++;
  save(); stopTimer(); go("home");
}
function abandon(){ if(confirm("Discard this session and everything logged in it?")){ S.active=null; save(); go("home"); } }

/* ---- rest timer (timestamp-based so backgrounding can't drift it) ---- */
let tEnd=0, tInt=null;
function restTimer(sec){
  tEnd = Date.now()+sec*1000;
  clearInterval(tInt); tInt=setInterval(tick,250); tick();
}
function tick(){
  const left = Math.max(0, Math.round((tEnd-Date.now())/1000));
  const t=$("#timer"); t.classList.add("on");
  const m=Math.floor(left/60), s=String(left%60).padStart(2,"0");
  t.innerHTML = `<span style="font-size:22px" class="mono">${m}:${s}</span><span class="grow">Rest</span>
    <button onclick="restTimer(${30});event.stopPropagation()" style="padding:7px 10px">+30s</button>
    <button onclick="stopTimer();event.stopPropagation()" style="padding:7px 10px">Skip</button>`;
  if(left<=0){ stopTimer(); beep(); }
}
function stopTimer(){ clearInterval(tInt); tInt=null; $("#timer").classList.remove("on"); }
function beep(){
  try{ const c=new (window.AudioContext||window.webkitAudioContext)();
    [0,.18,.36].forEach(d=>{ const o=c.createOscillator(), g=c.createGain();
      o.connect(g); g.connect(c.destination); o.frequency.value=880;
      g.gain.setValueAtTime(.001,c.currentTime+d);
      g.gain.exponentialRampToValueAtTime(.3,c.currentTime+d+.02);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d+.15);
      o.start(c.currentTime+d); o.stop(c.currentTime+d+.16); });
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,80,200]);
}

/* ---- export / import ---- */
function dl(name, text, type){
  const b=new Blob([text],{type}); const u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),2000);
}
function exportJSON(){ dl(`minmax-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(S,null,1), "application/json"); }
function exportCSV(){
  const rows=[["Date","Week","Day","Exercise","Set","Weight","Reps","RIR","TargetRIR","RepLow","RepHigh","Readiness","Est1RM"]];
  S.sessions.filter(s=>s.done).forEach(s=>Object.entries(s.entries||{}).forEach(([id,sets])=>{
    const ex=findEx(s.day,id); if(!ex) return;
    (sets||[]).forEach((x,k)=>{ if(!x||!x.reps) return;
      rows.push([new Date(s.date).toISOString().slice(0,10), s.week, PROGRAM[s.day].name, exName(ex),
        k+1, x.weight, x.reps, x.rir, rirFor(ex,s.week,k), ex.rep[0], ex.rep[1],
        s.readiness?.band||"", Math.round(x.weight*(1+x.reps/30))]);
    });
  }));
  dl(`minmax-log-${new Date().toISOString().slice(0,10)}.csv`,
     rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n"), "text/csv");
}
function unsub(id){ delete S.settings.subs[id]; save(); render(); }
function wipe(){ if(confirm("Erase all sessions, settings and history? This cannot be undone.")){
  localStorage.removeItem(KEY); S=structuredClone(DEF); go("home"); } }

/* ---- keep the screen awake during a session ---- */
let wl=null;
document.addEventListener("visibilitychange", async ()=>{
  if(document.visibilityState==="visible" && S.active && "wakeLock" in navigator){
    try{ wl = await navigator.wakeLock.request("screen"); }catch(e){}
  }
});

render();
</script>
