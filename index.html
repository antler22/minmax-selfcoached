   MIN-MAX SELF-COACHED  —  Nippard Min-Max Phase 2 skeleton
                            + RP autoregulation  + your barbell anchors
   Everything is data-driven. To tweak a workout, edit PROGRAM below.
   ========================================================================== */

/* ---------- 1. PROGRAM DEFINITION -----------------------------------------
   Nippard's Min-Max Phase 2 never changes set counts across the 12 weeks.
   It progresses ONLY by RIR + (in Block 2) intensity techniques:
     wk 1      = intro      -> "easy" RIR
     wk 2-6    = Block 1    -> "hard" RIR
     wk 7      = deload     -> "easy" RIR (+ we drop Tier-B work)
     wk 8-12   = Block 2    -> "hard" RIR + intensity technique
   Each exercise below carries the exact RIR schedule of the Nippard exercise
   it replaces, so the progression logic is preserved through the swaps.

   tier: "A" = never cut.  "B" = dropped automatically when time is short,
         on deload week, or when readiness is YELLOW/RED.
   inc:  load increment in lb when you earn a jump.
   pair: this is the high-rep back-off set of the exercise above it.
--------------------------------------------------------------------------- */

  ]},

  push: { name:"Push", muscles:["delts","chest","triceps","quads"], ex:[
    {id:"ohp",     n:"Seated DB Shoulder Press", tier:"A", sets:2, rep:[4,6], rest:180, inc:5, warm:"2-3",
     rir:{e:[1,2],h:[0,1]}, tech:"drop2", src:"Machine Shoulder Press",
     subs:["Seated Smith Machine Shoulder Press","Standing Barbell OHP","Machine Shoulder Press"],
     note:"Break at least 90 degrees at the elbow. Smooth and controlled — feel the delts."},

    {id:"dbbench", n:"DB Bench Press", tier:"A", sets:1, rep:[10,10], rest:180, inc:5, warm:"2-3",
     rir:{e:[1],h:[0]}, src:"DB Bench Press",
     subs:["Barbell Bench Press","Machine Chest Press"],
     note:"1 second pause at the bottom, tension on the pecs."},
    {id:"dbbench20",n:"DB Bench Press — Back-off", tier:"B", pair:"dbbench", sets:1, rep:[20,20], rest:180, inc:5, warm:"0",
     rir:{e:[1],h:[0]}, src:"DB Bench Press 1x20", subs:["Push-Up (to failure)"], note:""},

    {id:"slext",   n:"Single-Leg Leg Extension", tier:"B", sets:1, rep:[20,20], rest:90, inc:5, warm:"0-1", perLeg:true,
     rir:{e:[1],h:[0]}, src:"Single-Leg Leg Extension",
     subs:["Reverse Nordic","Sissy Squat"],
     note:"20 per leg. Nippard's extra weekly quad hit — cheap volume, keep it if you have time."},

    {id:"lat",     n:"DB Lateral Raise", tier:"A", sets:1, rep:[10,10], rest:90, inc:5, warm:"0-1",
     rir:{e:[0],h:[0]}, src:"Machine Lateral Raise",
     subs:["Cable Lateral Raise","Machine Lateral Raise"],
     note:"Resist the negative on every rep. Do not pause at the bottom."},
    {id:"lat20",   n:"DB Lateral Raise — Back-off", tier:"A", pair:"lat", sets:1, rep:[20,20], rest:90, inc:5, warm:"0",

     subs:["Cable Lateral Raise"],
     note:"Drop to roughly half the weight and chase 20. This pair IS your side-delt volume."},

    {id:"flye_p",  n:"DB Flye", tier:"B", sets:2, rep:[10,12], rest:90, inc:5, warm:"0-1",
     rir:{e:[0,1],h:[0,0]}, tech:"drop2", src:"Cable Flye",
     subs:["Cable Flye","Pec Deck"],

const DAY_ORDER = ["upper","lower","push","pull"];
const TOTAL_WEEKS = 12;

const weekKind = w => w===1 ? "intro" : w===7 ? "deload" : w<=6 ? "block1" : "block2";
const isEasyWeek = w => w===1 || w===7;
const blockOf    = w => w<=7 ? 1 : 2;

/* ---------- 2. STATE / PERSISTENCE --------------------------------------- */

/* Each profile is a completely separate log under its own storage key, so two
   people sharing the phone never contaminate each other's weight targets. */
const PKEY = "minmax_profiles";
const KEY  = p => "minmax_v1__" + p;
const DEF = {
  settings:{ unit:"lb", timeCap:45, subs:{}, bodyweight:null },
  week:1, dayIdx:0, sessions:[], active:null
};

const GUESTS = ["Lacy","Alex","Dad","Cory"];
function profiles(){
  try{ const r=JSON.parse(localStorage.getItem(PKEY));
       if(r&&r.list?.length){ GUESTS.forEach(g=>{ if(!r.list.includes(g)) r.list.push(g); }); return r; } }catch(e){}
  return { list:["Nick",...GUESTS], cur:"Nick" };
}
let P = profiles();
function saveProfiles(){ localStorage.setItem(PKEY, JSON.stringify(P)); }

let S = load();
function load(){
  try{ const r = JSON.parse(localStorage.getItem(KEY(P.cur)));
       if(r&&r.settings) return {...DEF,...r,settings:{...DEF.settings,...r.settings}}; }
  catch(e){ console.warn("load failed",e); }
  return structuredClone(DEF);
}
function save(){ localStorage.setItem(KEY(P.cur), JSON.stringify(S)); }

function switchProfile(name){
  if(S.active && !confirm(`${P.cur} has a session in progress. Switch to ${name} anyway? The session stays saved.`)) return;
  P.cur = name; saveProfiles(); S = load(); ui = {}; go("home");
  if(typeof syncAuto==="function") syncAuto();   // pull that profile's log too
}
function addProfile(){
  const n = (prompt("Name for the new profile?")||"").trim();
  if(!n) return;
  if(P.list.includes(n)){ alert("That profile already exists."); return; }
  P.list.push(n); saveProfiles(); switchProfile(n);
}

// display name honours any substitution you've chosen
const exName = ex => S.settings.subs[ex.id] || ex.n;

/* Which piece of equipment a movement uses, read off its name. */
function implementOf(name){
  const n = String(name||"");
  if(/^EZ-Bar/i.test(n))   return "ez";
  if(/^DB /i.test(n))      return "db";
  if(/^Barbell|^Smith/i.test(n)) return "bb";
  if(/Cable/i.test(n))     return "cable";
  if(/Machine|Pec Deck/i.test(n)) return "machine";
  return null;
}

/* Supersets exist so you don't re-rack between the two lifts. If you swap one half
   onto a different implement, the partner has to follow or the pairing stops making
   sense — you'd be grabbing a barbell for one and an EZ bar for the other. */
function applySub(exId, name){
  const setOne = (id,n)=> n ? (S.settings.subs[id]=n) : delete S.settings.subs[id];
  setOne(exId, name);

  let self, day;
  DAY_ORDER.forEach(d=>{ const f=findEx(d,exId); if(f){ self=f; day=d; } });
  if(!self || !self.ss) return;

  const imp = implementOf(name || self.n);
  if(!imp) return;
  PROGRAM[day].ex.forEach(p=>{
    if(p.id===exId || p.ss!==self.ss) return;
    if(implementOf(exName(p))===imp) return;             // already matches
    const match = [p.n, ...(p.subs||[])].find(o=>implementOf(o)===imp);
    if(match) setOne(p.id, match===p.n ? null : match);
  });
}

/* ---------- 3. COACHING ENGINE ------------------------------------------- */

// RIR prescribed for a given exercise/set/week (inherits the Nippard schedule)
function rirFor(ex, week, setIdx){
  const a = isEasyWeek(week) ? ex.rir.e : ex.rir.h;
  return a[Math.min(setIdx, a.length-1)];
}
// Intensity technique only exists in Block 2 (weeks 8-12), on the last set
function techFor(ex, week){ return (blockOf(week)===2 && week!==7 && ex.tech) ? ex.tech : null; }

function roundLoad(w, inc){
  if(w<=0) return 0;
  return Math.max(inc, Math.round(w/inc)*inc);
}

/* Deload weeks and Red auto-deload days are deliberately submaximal. They must
   never become the baseline for the next load target, or every deload would
   permanently ratchet your working weights down. They stay in the log and in
   your history — they're just skipped when answering "what should I lift?". */
const submaximal = s => s.week===7 || (s.readiness && s.readiness.band==="red");

// every logged set for an exercise, newest session first
function historyFor(exId, opts={}){
  const out=[];
  for(let i=S.sessions.length-1;i>=0;i--){
    const s=S.sessions[i], e=s.entries&&s.entries[exId];
    if(opts.working && submaximal(s)) continue;
    if(e && e.some(x=>x && x.reps>0)) out.push({session:s, sets:e.filter(x=>x&&x.reps>0)});
  }
  return out;
}

/* The core session-to-session prescription.
   Returns {weight, reps, msg, kind} for one set. */
function prescribe(ex, week, setIdx){
  const tRir = rirFor(ex, week, setIdx);
  const hist = historyFor(ex.id, {working:true});   // baseline ignores deload/Red days
  const [lo,hi] = ex.rep;

  if(!hist.length){
    return { weight:null, reps:lo, kind:"find",
      msg:`First time on this lift. Pick a load you could get about ${hi+2} reps with, then stop at RIR ${tRir}. Whatever you log becomes your baseline.` };
  }

  const last = hist[0];
  const prev = last.sets[Math.min(setIdx, last.sets.length-1)];
  const w = prev.weight, r = prev.reps, rir = prev.rir;
  const ago = last.session.week;
  const dl  = isEasyWeek(week);

  // Deload / intro week: back the load off deliberately
  if(dl && week===7){
    return { weight: roundLoad(w*0.9, ex.inc), reps:r, kind:"deload",
      msg:`Deload week. Same reps at about 90% of your week-6 load, stopping at RIR ${tRir}. The point is to shed fatigue — do not push.` };
  }

  /* At or past the top of the rep range means the load is too light — regardless of
     RIR. Chasing still more reps on a 4-6 exercise defeats the point of the range.
     Reps over the top AND unused RIR both say the same thing, so both feed the jump. */
  if(r >= hi){
    const over = r - hi, slack = Math.max(0, rir - tRir);
    const steps = Math.min(3, 1 + Math.floor((over + slack)/2));
    const bump = ex.inc*steps;
    const why = over && slack ? `${over} rep${over>1?"s":""} past the top of the range and still ${slack} in reserve`
              : over          ? `${over} rep${over>1?"s":""} past the top of the range`
              : slack         ? `the top of the range with ${slack} rep${slack>1?"s":""} still in reserve`
                              : `the top of the range`;
    return { weight: roundLoad(w+bump, ex.inc), reps:lo, kind:"up",
      msg:`Week ${ago} you got ${r} @ RIR ${rir} — ${why}. Add ${bump} lb and restart at ${lo} reps.` };
  }
  // In range but left reps in the tank: same load, push closer to failure
  if(r >= lo && rir > tRir){
    return { weight:w, reps:r+1, kind:"same",
      msg:`Last time you stopped at RIR ${rir} but the target is RIR ${tRir}. Same weight — go ${rir-tRir} rep${rir-tRir>1?"s":""} deeper. Aim for ${r+1}.` };
  }
  // In range, correct effort: chase one more rep (double progression)
  if(r >= lo){
    return { weight:w, reps:r+1, kind:"same",
      msg:`You got ${r} @ RIR ${rir}. Same weight — beat it. Target ${r+1}, and once you reach ${hi} the weight goes up.` };
  }
  // Under the range but they weren't actually near failure: keep the load, try again
  if(rir >= tRir+1){
    return { weight:w, reps:lo, kind:"same",
      msg:`Only ${r} reps last time, but at RIR ${rir} — that was pacing, not the weight. Keep ${w} and take it to RIR ${tRir}.` };
  }
  /* Genuinely under the range at target effort. One bad session is noise — sleep,
     stress, a rushed warm-up — and dropping 8% off a single miss wipes out weeks of
     progress and makes the load oscillate. Only cut after two in a row at the same weight. */
  const prior = hist[1] && hist[1].sets[Math.min(setIdx, hist[1].sets.length-1)];
  const missedTwice = prior && prior.weight >= w && prior.reps < lo && prior.rir <= tRir;
  if(!missedTwice){
    return { weight:w, reps:lo, kind:"hold",
      msg:`${r} reps @ RIR ${rir} came in under the ${lo}-${hi} range. One miss isn't a trend — same weight again. If you miss it twice in a row I'll drop the load for you.` };
  }
  return { weight: roundLoad(w*0.92, ex.inc), reps:lo, kind:"down",
    msg:`Second session in a row under ${lo} reps at ${w} lb. Dropping about 8% to rebuild — you'll pass the old number inside a couple of sessions.` };
}

/* ---- Readiness / fatigue monitoring (RP-flavoured) ---- */
const RQ = [
  {id:"sore", q:"Soreness in today's muscles", a:[
    ["Never got sore",0],["Healed a while ago",0],["Healed just today",1],["Still sore right now",3]]},
  {id:"sleep",q:"Sleep last night", a:[["Good",0],["OK",1],["Poor",2]]},
  {id:"energy",q:"Energy and motivation", a:[["High",0],["Normal",1],["Flat",2],["Drained",3]]},
  {id:"joint",q:"Joint or connective-tissue pain", a:[["None",0],["Minor niggle",1],["Real pain",3]]}
];

// Did the last two sessions of this day fail to beat their targets?
function perfRegression(dayKey){
  const past = S.sessions.filter(s=>s.day===dayKey && s.done).slice(-2);
  if(past.length<2) return false;
  return past.every(s=>{
    const vals=Object.values(s.entries||{}).flat().filter(x=>x&&x.reps>0);
    return vals.length && vals.filter(x=>x.missed).length > vals.length/2;
  });
}

function readiness(ans, dayKey){
  let score = RQ.reduce((t,q)=> t + (ans[q.id]??0), 0);
  const reg = perfRegression(dayKey);
  if(reg) score += 2;
  let band, label, advice;
  if(score<=2){ band="green"; label="Green — go as programmed";
    advice="You're recovered. Run the session exactly as prescribed and push the target RIR honestly."; }
  else if(score<=5){ band="yellow"; label="Yellow — trim the session";
    advice="Accumulating fatigue. Optional (Tier B) work is dropped and compounds get +1 RIR. Keep the hard sets, lose the junk volume."; }
  else { band="red"; label="Red — auto-deload today";
    advice="You are under-recovered. Today becomes one set per main lift at ~85% load and +3 RIR. This is a session you bank, not one you win."; }
  if((ans.joint??0)>=3) advice += " Flag: you reported real joint pain — substitute any movement that reproduces it before you start.";
  if(reg) advice += " Flag: you missed your targets in your last two "+PROGRAM[dayKey].name+" sessions, which counts against readiness.";
  return {score, band, label, advice, reg};
}

// Should he take a deload week early?
function deloadAdvice(){
  const done = S.sessions.filter(s=>s.done);
  const recent = done.slice(-3);
  const reds = recent.filter(s=>s.readiness&&s.readiness.band==="red").length;
  if(reds>=2) return "Two of your last three sessions came in Red. RP's rule of thumb is that repeated under-recovery means you're over your MRV — take the deload week now rather than grinding to week 7.";
  const yellows = done.slice(-4).filter(s=>s.readiness&&s.readiness.band!=="green").length;
  if(yellows>=4) return "Four sessions in a row below Green. Watch it — if this continues another week, pull the deload forward.";
  /* RP reads a vanishing pump alongside high session difficulty as the signature of
     training past what you're recovering from — stimulus down, cost up. */
  const flat = recent.filter(s=>s.post && s.post.pump>=2 && s.post.diff>=2).length;
  if(flat>=2) return "Your last sessions came back as brutal but with almost no pump — stimulus falling while cost rises. That's the classic sign you're past your MRV. Cut a set from the Tier B work, or take the deload early.";
  return null;
}

/* Build today's exercise list.
   Being short on TIME and being short on RECOVERY are different problems and get
   different answers. Low time cuts breadth only — you still push the lifts you do,
   and arguably harder. Low readiness cuts breadth *and* effort. */
function buildSession(dayKey, week, band, short){
  const day = PROGRAM[dayKey];
  const cut = band==="red" ? "red"
            : (band==="yellow" || week===7) ? "trim"
            : short ? "time" : "full";
  let list = day.ex.filter(ex=> cut==="full" ? true : ex.tier==="A");
  return list.map(ex=>{
    let sets = ex.sets, rirAdj = 0;
    if(cut==="red"){ sets = 1; rirAdj = 3; }
    else if(cut==="trim" && ex.tier==="A" && ex.sets>2 && week!==7){ sets = ex.sets-1; }
    else if(cut==="trim"){ rirAdj = ex.rest>=180 ? 1 : 0; }
    return {ex, sets, rirAdj, loadMul: cut==="red" ? 0.85 : 1};
  });
}

// rough duration in minutes
function estimate(plan){
  let s = 300; // warm-up
  plan.forEach(p=> s += p.sets * ((p.ex.rest||90) + 45));
  return Math.round(s/60);
}

/* ---- SESSION RUNNER ---- */
function vSession(){
  const a = S.active; if(!a) return vHome();
  const plan = a.plan.map(p=>({...p, ex: findEx(a.day, p.exId)}));
  const i = Math.min(a.idx, plan.length-1);
  const cur = plan[i], ex = cur.ex, week = a.week;
  const tech = techFor(ex, week), techInfo = tech?T[tech]:null;
  const entries = a.entries[ex.id] || [];
  const doneSets = entries.filter(x=>x&&x.reps>0).length;
  const ssPartner = ex.ss ? plan.find(p=>p.ex.ss===ex.ss && p.ex.id!==ex.id) : null;

  const rows = Array.from({length:cur.sets}, (_,k)=>{
    const tRir = Math.min(4, rirFor(ex,week,k) + (cur.rirAdj||0));
    const pre = prescribe(ex, week, k);
    const wt = pre.weight==null ? "" : Math.round(pre.weight*(cur.loadMul||1));
    const e = entries[k] || {};
    const isLast = k===cur.sets-1;
    const sel = ui.rirSel?.[`${ex.id}:${k}`];
    const chosen = e.rir!=null ? e.rir : sel;
    return `<div class="setblk ${e.reps>0?"done":""}">
      <div class="row sb xs" style="margin-bottom:8px">
        <b>Set ${k+1}</b>
        <span class="dim">target ${pre.reps}${ex.perLeg?"/leg":""} rep${pre.reps===1?"":"s"} · stop at RIR ${tRir}</span>
      </div>
      <div class="setrow">
        <input type="number" inputmode="decimal" placeholder="${wt||"lb"}" value="${draft(ex.id,k,"weight") ?? e.weight ?? ""}" data-set="${k}" data-f="weight">
        <input type="number" inputmode="numeric" placeholder="${pre.reps} reps" value="${draft(ex.id,k,"reps") ?? e.reps ?? ""}" data-set="${k}" data-f="reps">
        <button class="logset" data-set="${k}">${e.reps>0?"✓":"Log"}</button>
      </div>
      <div class="xs rirlbl ${chosen==null?"needrir":"dim"}" style="margin:9px 0 5px">
        ${chosen==null ? "RIR you actually hit — tap one (dashed = target)"
          : e.reps>0 ? "Logged at RIR "+chosen : "RIR "+chosen+" selected — now tap Log"}
      </div>
      <div class="chips">${[0,1,2,3,4].map(v=>
        `<button class="chip rirc ${v===tRir?"tgt":""} ${chosen===v?"on":""}" data-set="${k}" data-ex="${ex.id}" data-rir="${v}">${v}</button>`).join("")}</div>
      ${isLast&&techInfo?`<div class="xs dim" style="margin-top:8px">↑ ${esc(techInfo[0])} on this set</div>`:""}
    </div>`;
  }).join("");

  const pre0 = prescribe(ex, week, 0);
  const target = `${cur.sets} × ${ex.rep[0]===ex.rep[1]?ex.rep[0]:ex.rep[0]+"-"+ex.rep[1]}${ex.perLeg?" per leg":""}`;
  /* RIR often differs per set (Nippard ramps it: 0/1/1 on pull-ups). Showing only
     set 1's target here contradicted the per-set targets below it. */
  const rirSeq = Array.from({length:cur.sets},(_,k)=>Math.min(4, rirFor(ex,week,k)+(cur.rirAdj||0)));
  const rirLabel = new Set(rirSeq).size===1 ? `RIR ${rirSeq[0]}` : rirSeq.map(v=>v).join(" → ");

  return `
    <div class="row sb" style="margin:14px 0 4px">
      <button class="ghost sm" onclick="go('home')">‹ Exit</button>
      <div class="dots">${plan.map((p,k)=>{
        const d = (a.entries[p.ex.id]||[]).filter(x=>x&&x.reps>0).length >= p.sets;
        return `<div class="dot ${k===i?"cur":d?"on":""}"></div>`;}).join("")}</div>
      <span class="badge b-${a.readiness.band==="green"?"g":a.readiness.band==="yellow"?"w":"r"}">${esc(a.readiness.band)}</span>
    </div>

    <div class="card">
      <div class="xs dim">${esc(PROGRAM[a.day].name)} · Week ${week} · Exercise ${i+1} of ${plan.length}
        ${ex.tier==="B"?' · <span class="badge b-d">optional</span>':""}</div>
      <h1 style="margin:8px 0 2px">${esc(exName(ex))}</h1>
      ${ssPartner?`<div class="xs" style="color:var(--blue)">Superset ${esc(ex.ss)} with ${esc(exName(ssPartner.ex))} — alternate, minimal rest between</div>`:""}

      <div class="row" style="margin:16px 0 4px;align-items:flex-end;gap:18px">
        <div><div class="xs dim">Target load</div><div class="big mono">${pre0.weight==null?"—":Math.round(pre0.weight*(cur.loadMul||1))}<span style="font-size:16px" class="dim"> lb</span></div></div>
        <div><div class="xs dim">Sets × reps</div><div style="font-size:20px;font-weight:700">${target}</div></div>
        <div><div class="xs dim">Stop at${rirSeq.length>1&&new Set(rirSeq).size>1?" (per set)":""}</div>
          <div style="font-size:20px;font-weight:700">${rirLabel}</div></div>
      </div>

      <div class="coach">${esc(pre0.msg)}${cur.rirAdj?` <b>Readiness adjustment: +${cur.rirAdj} RIR today.</b>`:""}${cur.loadMul<1?` <b>Load cut to ${Math.round(cur.loadMul*100)}%.</b>`:""}</div>
      ${ex.warm&&ex.warm!=="0"?`<div class="sm dim">Warm-up: ${esc(ex.warm)} light set${ex.warm==="1"?"":"s"} first — not to failure, just to groove the pattern.</div>`:""}
      ${ex.note?`<div class="sm" style="margin-top:8px">${esc(ex.note)}</div>`:""}
      ${techInfo?`<div class="tech"><b>${esc(techInfo[0])}</b> — last set only.<br>${esc(techInfo[1])}</div>`:""}

      <div class="hr"></div>
      ${rows}

      <details style="margin-top:10px"><summary>Swap this exercise</summary>
        <div class="chips" style="margin-top:8px">
          <button class="chip sub" data-ex="${ex.id}" data-name="">${esc(ex.n)} (default)</button>
          ${(ex.subs||[]).map(s=>`<button class="chip sub ${S.settings.subs[ex.id]===s?"on":""}" data-ex="${ex.id}" data-name="${esc(s)}">${esc(s)}</button>`).join("")}
        </div>
        <div class="xs dim" style="margin-top:8px">Swapping keeps this slot's sets, reps and RIR schedule — only the movement changes. Your load history is tracked per slot, so a swap will reset your target load.</div>
      </details>
    </div>

    <div class="row" style="gap:10px;margin-bottom:20px">
      <button class="grow ghost" onclick="jump(-1)" ${i===0?"disabled":""}>‹ Previous</button>
      ${i===plan.length-1
        ? `<button class="grow pri" onclick="finish()">Finish session</button>`
        : `<button class="grow pri" onclick="jump(1)">Next exercise ›</button>`}
    </div>`;
}

function findEx(dayKey, id){ return PROGRAM[dayKey].ex.find(e=>e.id===id); }

/* Typed-but-not-yet-logged weight and reps.
   Any re-render of the session screen rebuilds the inputs from saved state, so
   without this a tap on an RIR chip (or a swap) threw away numbers you had already
   keyed in. Every re-render path calls captureDraft() first. */
const draft = (exId,k,f) => ui.draft?.[`${exId}:${k}:${f}`];
function captureDraft(){
  ui.draft = ui.draft||{};
  document.querySelectorAll("[data-set][data-f]").forEach(inp=>{
    const ex = S.active && S.active.plan[Math.min(S.active.idx,S.active.plan.length-1)]?.exId;
    if(!ex) return;
    if(inp.value!=="") ui.draft[`${ex}:${inp.dataset.set}:${inp.dataset.f}`] = inp.value;
    else delete ui.draft[`${ex}:${inp.dataset.set}:${inp.dataset.f}`];
  });
}
function clearDraft(exId,k){
  if(!ui.draft) return;
  ["weight","reps"].forEach(f=> delete ui.draft[`${exId}:${k}:${f}`]);
}

/* ---- HISTORY ---- */
function vHistory(){
  const done = S.sessions.filter(s=>s.done).slice().reverse();
  if(!done.length) return `<h1>History</h1><div class="card dim">No completed sessions yet. Your logged loads drive every weight target, so the coaching gets sharper after the first week.</div>`;
  /* Pull-ups log ADDED weight, so a bodyweight set is 0 lb — which made the estimated
     1RM come out as zero. Fold bodyweight in when the exercise is carrying it. */
  const bw = S.settings.bodyweight || 0;
  const prs = {};
  S.sessions.forEach(s=>Object.entries(s.entries||{}).forEach(([id,sets])=>{
    let ex; DAY_ORDER.forEach(d=>{const f=findEx(d,id); if(f)ex=f;});
    (sets||[]).forEach(x=>{ if(x&&x.reps>0){
      const load = x.weight + (ex&&ex.bw ? bw : 0);
      const e1 = load*(1+x.reps/30);
      if(!prs[id]||e1>prs[id].e1) prs[id]={e1,w:x.weight,r:x.reps,id,bw:!!(ex&&ex.bw)}; }});
  }));
  return `<h1>History</h1>
  <h2>Best estimated 1RM</h2>
  <div class="card"><div class="scroll"><table><tr><th>Exercise</th><th>Best set</th><th>Est. 1RM</th></tr>
  ${Object.values(prs).sort((a,b)=>b.e1-a.e1).map(p=>{
    let ex; DAY_ORDER.forEach(d=>{const f=findEx(d,p.id); if(f)ex=f;});
    return `<tr><td>${esc(ex?exName(ex):p.id)}</td>
      <td class="mono">${p.bw?(p.w>0?`BW+${p.w}`:"BW"):p.w} × ${p.r}</td>
      <td class="mono">${p.e1>0?Math.round(p.e1):"—"}</td></tr>`;
  }).join("")}</table></div>
  ${Object.values(prs).some(p=>p.bw)&&!bw?`<div class="xs dim" style="margin-top:10px">Set your bodyweight in Settings so pull-up numbers count properly.</div>`:""}</div>
  <h2>Trend</h2>
  ${vTrend()}
  <h2>Sessions</h2>
  <div class="xs dim" style="margin:-4px 0 8px">Tap a session to correct anything you mis-logged.</div>
  ${done.map(s=>{
    const n = Object.values(s.entries||{}).flat().filter(x=>x&&x.reps>0).length;
    const b = s.readiness?.band||"green";
    const idx = S.sessions.indexOf(s);
    return `<div class="card" style="cursor:pointer" onclick="openSession(${idx})"><div class="row sb">
      <div><b>${esc(PROGRAM[s.day].name)}</b> <span class="dim sm">· Week ${s.week}</span>
        <div class="dim xs">${new Date(s.date).toLocaleDateString()} · ${n} sets${s.mins?` · ${s.mins} min`:""}</div></div>
      <div class="row" style="gap:8px"><span class="badge b-${b==="green"?"g":b==="yellow"?"w":"r"}">${esc(b)}</span>
        <span class="dim">›</span></div></div>
      ${s.note?`<div class="sm dim" style="margin-top:8px">${esc(s.note)}</div>`:""}</div>`;
  }).join("")}
  <button class="wide ghost" style="margin-bottom:24px" onclick="exportCSV()">Export CSV for Sheets</button>`;
}

/* ---- per-exercise trend ---- */
function trendData(exId){
  let ex; DAY_ORDER.forEach(d=>{const f=findEx(d,exId); if(f)ex=f;});
  const bw = ex&&ex.bw ? (S.settings.bodyweight||0) : 0;
  return S.sessions.filter(s=>s.done && s.entries?.[exId]).map(s=>{
    const sets=(s.entries[exId]||[]).filter(x=>x&&x.reps>0);
    if(!sets.length) return null;
    const best=sets.reduce((a,x)=> (x.weight+bw)*(1+x.reps/30) > (a.weight+bw)*(1+a.reps/30) ? x : a);
    return { week:s.week, date:s.date, e1:Math.round((best.weight+bw)*(1+best.reps/30)),
             w:best.weight, r:best.reps, sub:submaximal(s) };
  }).filter(Boolean);
}

function vTrend(){
  const ids=[...new Set(S.sessions.flatMap(s=>Object.keys(s.entries||{})))]
    .filter(id=>trendData(id).length>0);
  if(!ids.length) return `<div class="card dim sm">Log a couple of sessions and your strength curve shows up here.</div>`;
  const sel = ui.trendEx && ids.includes(ui.trendEx) ? ui.trendEx : ids[0];
  let ex; DAY_ORDER.forEach(d=>{const f=findEx(d,sel); if(f)ex=f;});
  const d = trendData(sel);

  const W=320,H=130,PADL=34,PADB=20,PADT=10;
  const vals=d.map(p=>p.e1), lo=Math.min(...vals), hi=Math.max(...vals);
  const span=(hi-lo)||1, min=lo-span*0.15, max=hi+span*0.15;
  const x=i=> d.length<2 ? PADL+(W-PADL)/2 : PADL+i*(W-PADL-6)/(d.length-1);
  const y=v=> PADT+(H-PADT-PADB)*(1-(v-min)/(max-min));
  const line=d.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.e1).toFixed(1)}`).join("");
  const area=d.length>1?`${line}L${x(d.length-1).toFixed(1)},${H-PADB}L${PADL},${H-PADB}Z`:"";
  const first=d[0].e1, last=d[d.length-1].e1, chg=last-first;
  const pct=first?Math.round(chg/first*100):0;

  return `<div class="card">
    <div class="chips" style="margin-bottom:12px">${ids.map(id=>{
      let e; DAY_ORDER.forEach(dd=>{const f=findEx(dd,id); if(f)e=f;});
      return `<button class="chip trex ${id===sel?"on":""}" data-ex="${id}">${esc(e?exName(e):id)}</button>`;
    }).join("")}</div>
    <div class="row sb" style="align-items:flex-end">
      <div><div class="xs dim">Best est. 1RM</div><div class="big mono">${last}<span class="dim" style="font-size:15px"> lb</span></div></div>
      <div style="text-align:right"><div class="xs dim">Since first session</div>
        <div style="font-size:17px;font-weight:700;color:${chg>0?"var(--acc)":chg<0?"var(--bad)":"var(--dim)"}">
          ${chg>0?"+":""}${chg} lb${first?` (${chg>0?"+":""}${pct}%)`:""}</div></div>
    </div>
    <div class="scroll"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:10px;overflow:visible">
      ${[min,(min+max)/2,max].map(v=>`<line x1="${PADL}" x2="${W}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"
          stroke="var(--line)" stroke-width="1"/>
        <text x="${PADL-6}" y="${(y(v)+4).toFixed(1)}" fill="var(--dim)" font-size="9" text-anchor="end">${Math.round(v)}</text>`).join("")}
      ${area?`<path d="${area}" fill="var(--blue)" opacity=".10"/>`:""}
      <path d="${line}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round"/>
      ${d.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.e1).toFixed(1)}" r="${i===d.length-1?4:3}"
         fill="${p.sub?"var(--warn)":"var(--blue)"}"><title>Wk ${p.week}: ${p.w}×${p.r} → ${p.e1} lb</title></circle>`).join("")}
      ${d.map((p,i)=> i===0||i===d.length-1||d.length<6
        ? `<text x="${x(i).toFixed(1)}" y="${H-6}" fill="var(--dim)" font-size="9" text-anchor="middle">w${p.week}</text>`:"").join("")}
    </svg></div>
    <div class="xs dim" style="margin-top:6px">Best set per session, as estimated 1RM${ex&&ex.bw?" (bodyweight included)":""}.
      ${d.some(p=>p.sub)?`<span style="color:var(--warn)">Amber points are deload or Red-day sessions — deliberately submaximal.</span>`:""}</div>
  </div>`;
}

/* Read the weight/reps inputs into state. Must run before ANY re-render of this
   view — otherwise tapping an RIR chip rebuilds the inputs from stored values and
   silently throws away whatever you had just typed. */
function captureEdits(){
  const s=S.sessions[ui.editIdx]; if(!s) return;
  document.querySelectorAll("[data-e][data-f]").forEach(inp=>{
    const e=s.entries[inp.dataset.e], k=+inp.dataset.k;
    if(!e||!e[k]) return;
    const v=parseFloat(inp.value);
    if(!isNaN(v)) e[k][inp.dataset.f] = inp.dataset.f==="reps" ? Math.round(v) : v;
  });
  // recompute the missed flag so readiness keeps reading true
  Object.entries(s.entries).forEach(([id,sets])=>{
    let ex; DAY_ORDER.forEach(d=>{const f=findEx(d,id); if(f)ex=f;});
    (sets||[]).forEach(x=>{ if(x&&ex) x.missed = x.reps < ex.rep[0]; });
  });
}
function saveEdits(){
  captureEdits(); save();
  if(ghToken()) syncPush(true);
  go("history");
}
function delSet(i,id,k){
  captureEdits();
  if(!confirm("Delete this set?")) return;
  S.sessions[i].entries[id].splice(k,1);
  if(!S.sessions[i].entries[id].filter(Boolean).length) delete S.sessions[i].entries[id];
  save(); if(ghToken()) syncPush(true); render();
}
function delSession(i){
  if(!confirm("Delete this entire session? Your weight targets will be recalculated without it.")) return;
  S.sessions.splice(i,1); save(); if(ghToken()) syncPush(true); go("history");
}

/* ---------- 5. EVENT BINDING --------------------------------------------- */
function bind(){
  // readiness chips
  document.querySelectorAll(".rq").forEach(b=> b.onclick = ()=>{
    document.querySelectorAll(`.rq[data-q="${b.dataset.q}"]`).forEach(x=>x.className="chip rq");
    ui.ans = ui.ans||{}; ui.ansI = ui.ansI||{};
    ui.ans[b.dataset.q] = +b.dataset.v; ui.ansI[b.dataset.q] = b.dataset.i;
    const band = +b.dataset.v>=3?"r":+b.dataset.v>=1?"w":"g";
    b.className = "chip rq on "+band;
    if(Object.keys(ui.ans).length===RQ.length) showReadiness();
  });
  // a re-render rebuilds the chips, so repaint any answers already given
  if(ui.ansI) Object.entries(ui.ansI).forEach(([q,i])=>{
    const b = document.querySelector(`.rq[data-q="${q}"][data-i="${i}"]`);
    if(b) b.className = "chip rq on " + (ui.ans[q]>=3?"r":ui.ans[q]>=1?"w":"g");
  });
  if(ui.rd && $("#rdout")) showReadiness();
  const ds = $("#daysel"); if(ds) ds.onchange = ()=>{ S.dayIdx = +ds.value; save(); render(); };
  const cap = $("#cap"); if(cap) cap.onchange = ()=>{ S.settings.timeCap = +cap.value||45; save(); };
  const wk  = $("#wk");  if(wk)  wk.onchange  = ()=>{ S.week = Math.max(1,Math.min(12,+wk.value||1)); save(); };
  const bwt = $("#bwt"); if(bwt) bwt.onchange = ()=>{ S.settings.bodyweight = +bwt.value||null; save(); };
  const imp = $("#imp"); if(imp) imp.onchange = e=>{
    const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ S={...DEF,...JSON.parse(r.result)}; save(); render(); alert("Backup restored."); }
                   catch(err){ alert("That file couldn't be read as a backup."); } };
    r.readAsText(f);
  };
  // set logging
  document.querySelectorAll(".logset").forEach(b=> b.onclick = ()=> logSet(+b.dataset.set));
  document.querySelectorAll(".trex").forEach(b=> b.onclick = ()=>{ ui.trendEx=b.dataset.ex; render(); });
  document.querySelectorAll(".erir").forEach(b=> b.onclick = ()=>{
    captureEdits();                       // keep any typed weight/reps before re-rendering
    const s=S.sessions[ui.editIdx], e=s.entries[b.dataset.e];
    if(e&&e[+b.dataset.k]) e[+b.dataset.k].rir = +b.dataset.rir;
    save(); render();
  });
  const tok=$("#ghtok"); if(tok) tok.onchange = ()=> saveToken(tok.value);
  document.querySelectorAll(".pq").forEach(b=> b.onclick = ()=>{
    ui.post = ui.post||{};
    ui.post[b.dataset.q] = +b.dataset.v; ui.post[b.dataset.q+"_i"] = +b.dataset.i;
    render();
  });
  document.querySelectorAll(".rirc").forEach(b=> b.onclick = ()=>{
    captureDraft();                       // keep anything typed but not yet logged
    ui.rirSel = ui.rirSel||{};
    ui.rirSel[`${b.dataset.ex}:${b.dataset.set}`] = +b.dataset.rir;
    render();
  });
  document.querySelectorAll(".sub").forEach(b=> b.onclick = ()=>{
    captureDraft();
    applySub(b.dataset.ex, b.dataset.name);
    save(); render();
  });
  const sb = $("#startbtn"); if(sb && ui.rd) sb.onclick = start;
  const short = $("#shortbtn");
  if(short) short.onclick = ()=>{ ui.short = !ui.short; render(); if(ui.rd) showReadiness(); };
}


function showReadiness(){
  const dayKey = DAY_ORDER[S.dayIdx];
  const rd = readiness(ui.ans, dayKey);
  ui.rd = rd;
  const plan = buildSession(dayKey, S.week, rd.band, ui.short);
  const b = rd.band==="green"?"g":rd.band==="yellow"?"w":"r";
  $("#rdout").innerHTML = `<div class="card" style="margin-top:14px;background:var(--card2)">
    <span class="badge b-${b}">${esc(rd.label)}</span>
    <div class="sm" style="margin-top:9px">${esc(rd.advice)}</div>
    <div class="hr"></div>
    <div class="row sb sm"><span class="dim">Today's session</span>
      <b>${plan.length} exercises · ~${estimate(plan)} min</b></div>
    ${ui.short&&rd.band==="green"?`<div class="xs dim" style="margin-top:6px">Trimmed to Tier A for time — your recovery was fine.</div>`:""}
  </div>`;
  const sb = $("#startbtn");
  sb.disabled = false; sb.textContent = "Start "+PROGRAM[dayKey].name;
  sb.onclick = start;
}

function start(){
  const dayKey = DAY_ORDER[S.dayIdx];
  const plan = buildSession(dayKey, S.week, ui.rd.band, ui.short);
  S.active = { day:dayKey, week:S.week, date:Date.now(), readiness:ui.rd, short:!!ui.short, idx:0, entries:{},
               plan: plan.map(p=>({exId:p.ex.id, sets:p.sets, rirAdj:p.rirAdj, loadMul:p.loadMul})) };
  save(); ui.ans=null; ui.ansI=null; ui.rd=null; ui.short=false; go("session");
}

function logSet(k){
  const a=S.active, ex=findEx(a.day, a.plan[Math.min(a.idx,a.plan.length-1)].exId);
  const g=f=>document.querySelector(`[data-set="${k}"][data-f="${f}"]`);
  const w=parseFloat(g("weight").value), r=parseInt(g("reps").value);
  if(isNaN(r)||r<=0){ alert("Enter the reps you actually got."); return; }
  /* RIR must be an explicit choice. It used to default to the prescribed target,
     which meant tapping Log without thinking recorded "hit target exactly" — and
     every future weight suggestion was then computed from data you never gave. */
  const existing = (a.entries[ex.id]||[])[k];
  const rir = ui.rirSel?.[`${ex.id}:${k}`] ?? existing?.rir;
  if(rir==null){ alert("Tap the RIR you actually hit — how many more reps you had left. It drives every weight target from here on."); return; }

  const pre = prescribe(ex, a.week, k);
  // actual rest before this set, so reps stay comparable session to session
  const restTaken = a.lastSetAt ? Math.round((Date.now()-a.lastSetAt)/1000) : null;
  a.entries[ex.id] = a.entries[ex.id]||[];
  a.entries[ex.id][k] = { weight:isNaN(w)?(pre.weight||0):w, reps:r, rir,
                          rest:restTaken, missed: r < ex.rep[0] };
  a.lastSetAt = Date.now();
  clearDraft(ex.id, k);
  save();
  const cur = a.plan[Math.min(a.idx,a.plan.length-1)];
  if(k < cur.sets-1 && ex.rest) restTimer(ex.rest);
  render();
}

function jump(d){ captureDraft(); S.active.idx = Math.max(0, Math.min(S.active.plan.length-1, S.active.idx+d)); save(); render(); }

/* RIR tells you how hard each SET was. It says nothing about whether the session
   as a whole produced a useful stimulus, or whether you can recover from it — which
   is what RP uses pump and session difficulty for. Two taps, asked once, at the end. */
const PQ = [
  {id:"pump", q:"Pump in the muscles you trained", a:[["Barely any",2],["Decent",0],["Huge",0]]},
  {id:"diff", q:"How did the session as a whole feel?", a:[["Easy",0],["About right",0],["Brutal",2]]}
];

function finish(){ go("wrap"); }

function saveSession(){
  const a=S.active;
  a.done=true;
  a.post=ui.post||{};
  a.note=($("#snote")?.value)||"";
  a.mins=Math.round((Date.now()-a.date)/60000);
  S.sessions.push(a); S.active=null; ui.post=null; ui.rirSel=null;
  // advance the day pointer; roll the week after Pull
  S.dayIdx = (S.dayIdx+1) % DAY_ORDER.length;
  if(S.dayIdx===0 && S.week<TOTAL_WEEKS) S.week++;
  save(); stopTimer(); go("home");
  if(ghToken()) syncPush(true).then(ok=>{ if(!ok) render(); });   // fire-and-forget backup
}

function vWrap(){
  const a=S.active; if(!a) return vHome();
  const sets=Object.values(a.entries||{}).flat().filter(x=>x&&x.reps>0);
  const rests=sets.map(x=>x.rest).filter(v=>v>0);
  const avgRest=rests.length?Math.round(rests.reduce((t,v)=>t+v,0)/rests.length):null;
  return `<h1>Session done</h1>
  <div class="card">
    <div class="row sb"><span class="dim sm">${esc(PROGRAM[a.day].name)} · Week ${a.week}</span>
      <b>${sets.length} sets · ${Math.round((Date.now()-a.date)/60000)} min</b></div>
    ${avgRest?`<div class="dim xs" style="margin-top:6px">Average rest between sets: ${Math.floor(avgRest/60)}:${String(avgRest%60).padStart(2,"0")}</div>`:""}
  </div>
  <div class="card">
    <div class="sm dim" style="margin-bottom:4px">Two questions. These feed the volume and deload decisions — RIR alone can't tell me whether a session was worth doing.</div>
    ${PQ.map(q=>`<div style="margin:14px 0"><div class="sm" style="margin-bottom:7px">${esc(q.q)}</div>
      <div class="chips">${q.a.map((o,i)=>
        `<button class="chip pq ${ui.post?.[q.id+"_i"]==i?"on":""}" data-q="${q.id}" data-v="${o[1]}" data-i="${i}">${esc(o[0])}</button>`).join("")}</div></div>`).join("")}
    <input id="snote" placeholder="Note (optional)" value="${esc(a.note||"")}" style="margin-top:8px">
    <button class="pri wide" style="margin-top:14px" onclick="saveSession()">Save session</button>
  </div>`;
}
function abandon(){ if(confirm("Discard this session and everything logged in it?")){ S.active=null; save(); go("home"); } }

/* ---- rest timer (timestamp-based so backgrounding can't drift it) ----
   The buttons are built ONCE. They used to be re-created by innerHTML on every
   250ms tick, so a tap that spanned a redraw landed on an element that no longer
   existed and no click ever fired — which is why Skip felt unreliable on a phone. */
let tEnd=0, tInt=null, tBuilt=false;
function buildTimer(){
  const t=$("#timer");
  t.innerHTML = `<span style="font-size:22px" class="mono" id="tleft">0:00</span>
    <span class="grow">Rest</span>
    <button id="tplus" style="padding:7px 10px">+30s</button>
    <button id="tskip" style="padding:7px 10px">Skip</button>`;
  $("#tplus").onclick = e=>{ e.stopPropagation(); tEnd += 30000; tick(); };   // extend, don't restart
  $("#tskip").onclick = e=>{ e.stopPropagation(); stopTimer(); };
  tBuilt = true;
}
function restTimer(sec){
  if(!tBuilt) buildTimer();
  tEnd = Date.now()+sec*1000;
  clearInterval(tInt); tInt=setInterval(tick,250); tick();
}
function tick(){
  const left = Math.max(0, Math.round((tEnd-Date.now())/1000));
  const t=$("#timer"); t.classList.add("on");
  $("#tleft").textContent = `${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
  if(left<=0){ stopTimer(); beep(); }
}
function stopTimer(){ clearInterval(tInt); tInt=null; $("#timer").classList.remove("on"); }
function beep(){
  try{ const c=new (window.AudioContext||window.webkitAudioContext)();
    [0,.18,.36].forEach(d=>{ const o=c.createOscillator(), g=c.createGain();
      o.connect(g); g.connect(c.destination); o.frequency.value=880;
      g.gain.setValueAtTime(.001,c.currentTime+d);
      g.gain.exponentialRampToValueAtTime(.3,c.currentTime+d+.02);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d+.15);
      o.start(c.currentTime+d); o.stop(c.currentTime+d+.16); });
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,80,200]);
}

/* ---- export / import ---- */
function dl(name, text, type){
  const b=new Blob([text],{type}); const u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),2000);
}
function exportJSON(){ dl(`minmax-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(S,null,1), "application/json"); }
function csvText(){
  const rows=[["Profile","Date","Week","Day","Exercise","Set","Weight","Reps","RIR","TargetRIR","RepLow","RepHigh","RestSec","Readiness","Pump","Difficulty","Est1RM"]];
  S.sessions.filter(s=>s.done).forEach(s=>Object.entries(s.entries||{}).forEach(([id,sets])=>{
    const ex=findEx(s.day,id); if(!ex) return;
    (sets||[]).forEach((x,k)=>{ if(!x||!x.reps) return;
      const load = x.weight + (ex.bw ? (S.settings.bodyweight||0) : 0);
      rows.push([P.cur, new Date(s.date).toISOString().slice(0,10), s.week, PROGRAM[s.day].name, exName(ex),
        k+1, x.weight, x.reps, x.rir, rirFor(ex,s.week,k), ex.rep[0], ex.rep[1],
        x.rest??"", s.readiness?.band||"", s.post?.pump??"", s.post?.diff??"",
        Math.round(load*(1+x.reps/30))]);
    });
  }));
  return rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
}
function exportCSV(){
  dl(`minmax-${P.cur}-${new Date().toISOString().slice(0,10)}.csv`, csvText(), "text/csv");
}
function unsub(id){ delete S.settings.subs[id]; save(); render(); }

/* ---------- 6. GITHUB SYNC ------------------------------------------------
   localStorage is a cache; this repo is the source of truth. Clearing site data,
   switching phones or a browser evicting storage no longer costs you the log.

   The token lives ONLY in this browser under its own key and is never written to
   either repo. The app repo has to be public for GitHub Pages, so the data goes to
   a separate PRIVATE repo — your training history isn't public just because the
   code is. Use a fine-grained token scoped to minmax-log alone; then the worst a
   stolen token can do is touch that one repo.
-------------------------------------------------------------------------- */
const TKEY = "minmax_gh_token";
const GH = { owner:"antler22", repo:"minmax-log" };
const ghToken = () => localStorage.getItem(TKEY) || "";
const b64 = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const unb64 = s => new TextDecoder().decode(Uint8Array.from(atob(s), c=>c.charCodeAt(0)));

async function ghApi(path, opts={}){
  const t = ghToken();
  if(!t) throw new Error("No GitHub token saved. Add one in Settings.");
  const r = await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/${path}`, {
    ...opts, headers:{ Authorization:`Bearer ${t}`, Accept:"application/vnd.github+json",
                       "Content-Type":"application/json", ...(opts.headers||{}) }});
  if(r.status===404 && opts.method!=="PUT") return null;
  if(!r.ok){
    const msg = (await r.json().catch(()=>({}))).message || r.statusText;
    throw new Error(r.status===401 ? "Token rejected (401). It may be expired or lack Contents: write."
                  : r.status===403 ? "Forbidden (403). Check the token is scoped to the minmax-log repo."
                  : `GitHub ${r.status}: ${msg}`);
  }
  return r.json();
}

async function ghPut(path, text, sha){
  return ghApi(`contents/${path}`, { method:"PUT", body:JSON.stringify({
    message:`Update ${path} — ${new Date().toISOString().slice(0,16).replace("T"," ")}`,
    content:b64(text), ...(sha?{sha}:{}) })});
}
async function ghGet(path){
  const r = await ghApi(`contents/${path}`);
  return r ? { text:unb64(r.content), sha:r.sha } : null;
}

const csvPath  = p => `logs/${p}.csv`;
const jsonPath = p => `logs/${p}.json`;

/* Push the active profile: CSV for reading, JSON for lossless restore. */
async function syncPush(quiet){
  const setSt = m => { S.syncMsg=m; if(!quiet) render(); };
  try{
    setSt("Pushing…");
    const csv  = csvText();
    const json = JSON.stringify({...S, syncMsg:undefined}, null, 1);
    for(const [path,body] of [[csvPath(P.cur),csv],[jsonPath(P.cur),json]]){
      const cur = await ghGet(path);
      await ghPut(path, body, cur?.sha);
    }
    S.syncedAt = Date.now(); S.syncMsg = null; save(); if(!quiet) render();
    return true;
  }catch(e){ setSt("Sync failed: "+e.message); save(); return false; }
}

/* Pull the active profile back from the repo, replacing local state. */
async function syncPull(){
  if(S.sessions.length && !confirm(`Replace ${P.cur}'s local log with the copy on GitHub? Anything not yet pushed is lost.`)) return;
  S.syncMsg="Pulling…"; render();
  try{
    const f = await ghGet(jsonPath(P.cur));
    if(!f){ S.syncMsg=`No saved log on GitHub for ${P.cur} yet.`; render(); return; }
    const r = JSON.parse(f.text);
    S = {...DEF, ...r, settings:{...DEF.settings, ...(r.settings||{})}};
    S.syncedAt = Date.now(); S.syncMsg = null; save(); ui={}; go("home");
  }catch(e){ S.syncMsg="Pull failed: "+e.message; render(); }
}

/* Run on load. Opening the app should be enough to see your data on a new device —
   having to remember a manual Pull is exactly how you end up training off a stale log.
   Never silently overwrites: it adopts only when there's nothing local to lose, and
   otherwise asks. */
async function syncAuto(){
  if(!ghToken()) return;
  if(S.active) return;                       // never disturb a session in progress
  try{
    const f = await ghGet(jsonPath(P.cur));
    if(!f) { if(S.sessions.length) syncPush(true); return; }   // first ever push
    const r = JSON.parse(f.text);
    const remote = (r.sessions||[]).length, local = S.sessions.length;
    if(remote > local && local === 0){
      S = {...DEF, ...r, settings:{...DEF.settings, ...(r.settings||{})}};
      S.syncedAt = Date.now(); save(); render();
    } else if(remote > local){
      S.syncMsg = `GitHub has ${remote} sessions for ${P.cur}, this device has ${local}. Tap Pull in Settings to take the GitHub copy.`;
      render();
    } else if(local > remote){
      syncPush(true);                        // this device is ahead — back it up
    }
  }catch(e){ S.syncMsg = "Sync check failed: "+e.message; render(); }
}

function saveToken(v){
  const t=(v||"").trim();
  if(t) localStorage.setItem(TKEY,t); else localStorage.removeItem(TKEY);
  render();
}
async function testToken(){
  S.syncMsg="Checking…"; render();
  try{ await ghApi(""); S.syncMsg="Token works — connected to "+GH.repo; }
  catch(e){ S.syncMsg=e.message; }
  render();
}
function wipe(){ if(confirm(`Erase all sessions, settings and history for ${P.cur}? This cannot be undone.`)){
  localStorage.removeItem(KEY(P.cur)); S=structuredClone(DEF); go("home"); } }

/* ---- keep the screen awake during a session ---- */
let wl=null;
document.addEventListener("visibilitychange", async ()=>{
  if(document.visibilityState==="visible" && S.active && "wakeLock" in navigator){
    try{ wl = await navigator.wakeLock.request("screen"); }catch(e){}
  }
});

render();
syncAuto();
</script>
